services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mortgage
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "python -m backend.app.migrate && exec uvicorn backend.app.main:app --host 0.0.0.0"]
    environment: &backend
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MORTGAGE_DATA: /data
      AUTO_CREATE_SCHEMA: "0"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?Set REVIEWER_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PROCESSOR_PASSWORD: ${PROCESSOR_PASSWORD:-}
      VISION_ENDPOINT: ${VISION_ENDPOINT:-}
      VISION_JSON_SCHEMA: ${VISION_JSON_SCHEMA:-0}
      VISION_IMAGE_EDGE: ${VISION_IMAGE_EDGE:-1024}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
    volumes:
      - documents:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.worker"]
    environment: *backend
    volumes:
      - documents:/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build: frontend
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
  documents:

